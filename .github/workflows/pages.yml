name: Deploy demo to GitHub Pages

# 把前端构建成「离线演示版」并发布到 GitHub Pages。
# 只发布静态产物，不涉及后端（后端需要 Neo4j + 模型，跑不了 Pages）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build demo bundle
        working-directory: frontend
        # 子路径部署：资源前缀必须是 /<仓库名>/
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build:demo

      - name: Verify output
        working-directory: frontend
        run: |
          test -f dist-demo/index.html || { echo "缺少 index.html"; exit 1; }
          test -f dist-demo/demo/index.json || { echo "缺少演示数据"; exit 1; }
          echo "产物大小：$(du -sh dist-demo | cut -f1)"
          grep -o 'src="[^"]*"' dist-demo/index.html | head -3

      # 注意：这一步要求仓库已启用 Pages（Settings → Pages → Source 选 GitHub Actions）。
      # 不启用就会失败，报 "Get Pages site failed"。GITHUB_TOKEN 没有权限替用户开启，
      # 所以不要在 yml 里用 enablement: true —— 它需要管理员权限，一样会失败。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
