# 生产部署：Neo4j + FastAPI + Caddy（自动 HTTPS）
#
# 和根目录的 docker-compose.yml 的区别：
#   - 首次启动会从 backup/neo4j.dump 导入图谱（根目录那份是空库，只适合本地开发）；
#   - 只暴露 Caddy 的 80/443，Neo4j 和 API 都不直接对公网开放；
#   - API 打开限流与每日配额，避免公网上的成本失控；
#   - 数据（索引 / 图片 / 模型缓存）挂载自 ./data，重建镜像不用重新生成。
#
# 用法（在 deploy/ 目录）：
#   cp .env.example .env      # 填 DEEPSEEK_API_KEY / NEO4J_PASSWORD / SITE_ADDRESS
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api
#
# 详细步骤（含数据打包、域名、备案、排错）见 docs/deploy.md

name: tcmqa

services:
  # 一次性任务：把 dump 灌进 neo4j_data 卷，灌完就退出。
  # 用独立容器而不是塞进 neo4j 的 entrypoint，是因为 neo4j-admin 要求数据库处于停止状态。
  neo4j-init:
    image: neo4j:5.26-community
    container_name: tcmqa-neo4j-init
    volumes:
      - neo4j_data:/data
      - ./backup:/backup:ro
    entrypoint:
      - /bin/bash
      - -lc
      - |
        if [ -f /data/databases/neo4j/neostore ]; then
          echo "[init] 数据库已存在，跳过导入"
        else
          echo "[init] 从 /backup 导入图谱…"
          neo4j-admin database load neo4j --from-path=/backup --overwrite-destination=true
          echo "[init] 导入完成"
        fi
    restart: "no"

  neo4j:
    image: neo4j:5.26-community
    container_name: tcmqa-neo4j
    depends_on:
      neo4j-init:
        condition: service_completed_successfully
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 deploy/.env 里设置 NEO4J_PASSWORD}
      # 4G 内存机器的保守配比：堆 1G + 页缓存 512M，剩下的留给 Python
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # 用 cypher-shell 真跑一条查询，比探测端口更能说明「库已经能读了」
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tcmqa-api
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      # 索引 / 图片 / 模型缓存 / SQLite 都在这里
      HF_HOME: /app/data/cache/hf
      HF_ENDPOINT: https://hf-mirror.com
      HERB_IMAGE_ROOT: /app/media/herbs
      MOL_IMAGE_ROOT: /app/media/mol
      # 走过 Caddy，才敢信 X-Forwarded-For
      TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-6}"
      DAILY_CHAT_LIMIT: "${DAILY_CHAT_LIMIT:-800}"
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
      - ./media/mol:/app/media/mol:ro
      # 可选：原始大图（1.13GB），不挂则只能看 480px 封面
      # - ./media/herbs:/app/media/herbs:ro
    ports:
      # 只绑本机，方便在服务器上 curl 排查；对外统一走 Caddy
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 120s   # 首次要加载 1407 篇索引 + 图像向量 + 预热模型
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: tcmqa-caddy
    depends_on:
      api:
        condition: service_started
    environment:
      # 填域名（example.com）→ 自动申请 Let's Encrypt 证书；
      # 不填 / 填 IP → 只走 80 端口的 HTTP
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  caddy_data:
  caddy_config:
